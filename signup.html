<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | The Fit Lab</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#111,#2b0000);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.signup-box{
    background:#1e1e1e;
    padding:40px;
    border-radius:15px;
    width:380px;
    box-shadow:0 0 20px rgba(255,0,0,.4);
    text-align:center;
}

.signup-box h1{
    color:#ff2d2d;
    margin-bottom:20px;
}

.signup-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
}

.signup-box button{
    width:100%;
    padding:12px;
    background:#ff2d2d;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
}

.signup-box button:hover{
    background:#cc0000;
}

.signup-box p{
    color:white;
    margin-top:20px;
}

.signup-box a{
    color:#00e5ff;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="signup-box">

<h1>Create Account</h1>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email Address">

<input type="tel" placeholder="Mobile Number">

<input type="password" placeholder="Create Password">

<input type="password" placeholder="Confirm Password">

<button onclick="signup()">Create Account</button>

<p>Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script>
function signup(){
    alert("Account Created Successfully!");
    window.location.href="login.html";
}
</script>

</body>
</html>
