<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | The Fit Lab</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#111;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:white;
        }

        .success-box{
            background:#1b1b1b;
            padding:40px;
            border-radius:15px;
            text-align:center;
            width:90%;
            max-width:450px;
            box-shadow:0 0 20px rgba(255,0,0,0.3);
        }

        .tick{
            width:90px;
            height:90px;
            background:#00c853;
            color:white;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:50px;
            margin:0 auto 20px;
        }

        h1{
            color:#00e676;
            margin-bottom:15px;
        }

        p{
            color:#ddd;
            margin:10px 0;
            line-height:1.6;
        }

        .details{
            margin-top:25px;
            background:#2a2a2a;
            padding:15px;
            border-radius:10px;
        }

        .details p{
            margin:8px 0;
        }

        .btn{
            display:inline-block;
            margin-top:25px;
            padding:14px 30px;
            background:#ff2d2d;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-size:18px;
            transition:.3s;
        }

        .btn:hover{
            background:#d90000;
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="tick">✓</div>

    <h1>Payment Successful!</h1>

    <p>Thank you for joining <b>The Fit Lab</b>.</p>
    <p>Your membership has been activated successfully.</p>

    <div class="details">
        <p><b>Plan:</b> Premium Membership</p>
        <p><b>Amount:</b> ₹2999</p>
        <p><b>Status:</b> Successful</p>
        <p><b>Transaction ID:</b> TFL2026001</p>
    </div>

    <a href="index.html" class="btn">Back to Home</a>

</div>

</body>
</html>
