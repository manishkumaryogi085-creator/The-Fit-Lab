<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | The Fit Lab</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#111,#2b0000);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:#1e1e1e;
padding:40px;
border-radius:15px;
width:350px;
box-shadow:0 0 20px rgba(255,0,0,.4);
text-align:center;
}

.login-box h1{
color:#ff2d2d;
margin-bottom:25px;
}

.login-box input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
outline:none;
font-size:16px;
}

.login-box button{
width:100%;
padding:12px;
background:#ff2d2d;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:15px;
}

.login-box button:hover{
background:#cc0000;
}

.login-box p{
color:white;
margin-top:20px;
}

.login-box a{
color:#00e5ff;
text-decoration:none;
}
</style>

</head>

<body>

<div class="login-box">

<h1>The Fit Lab</h1>

<input type="email" placeholder="Enter Email">

<input type="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

<p>Don't have an account?
<a href="signup.html">Sign Up</a>
</p>

</div>

<script>
function login(){
window.location.href="dashboard.html";
}
</script>

</body>
</html>
